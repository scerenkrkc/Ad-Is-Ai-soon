{% extends "base.html" %}
{% block title %}Kayıt Ol · AD&İS AI{% endblock %}
{% block content %}
  <h1>Kayıt ol</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Ad Soyad <input type="text" name="full_name" required /></label>
    <label>E-posta <input type="email" name="email" required /></label>
    <label>Şifre <input type="password" name="password" required /></label>
    <label>Şifre Tekrarı <input type="password" name="confirm_password" required /></label>
    <label>
      Kullanıcı rolü
      <select name="role" required>
        <option value="">Seçin</option>
        <option value="ogrenci">Öğrenci</option>
        <option value="komisyon">Komisyon Üyesi</option>
      </select>
    </label>
    <button type="submit">Kayıt Ol</button>
  </form>
  <p>Zaten hesabın var mı? <a href="{{ url_for('giris_yap') }}">Giriş yap</a></p>
{% endblock %}
